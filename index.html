<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>DeutschDuo · Wortschatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#F2F4F7; --surface:#FFFFFF; --ink:#18212B; --muted:#5B6776; --line:#D9DFE7;
    --brand:#1F4E79; --brand-ink:#FFFFFF; --good:#2E7D5B; --hard:#9A6412; --bad:#B23A3A;
    --soft:#E8EEF5;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10161D; --surface:#182029; --ink:#E7ECF2; --muted:#98A5B4; --line:#2A3542;
      --brand:#7FB0E0; --brand-ink:#0E1620; --good:#6CC39A; --hard:#E0AE5C; --bad:#E58585;
      --soft:#1F2A36;
    }
  }
  :root[data-theme="dark"]{
    --bg:#10161D; --surface:#182029; --ink:#E7ECF2; --muted:#98A5B4; --line:#2A3542;
    --brand:#7FB0E0; --brand-ink:#0E1620; --good:#6CC39A; --hard:#E0AE5C; --bad:#E58585;
    --soft:#1F2A36;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
  main{max-width:640px;margin:0 auto;padding:20px 16px 110px}
  h1{font:600 1.6rem/1.2 'Literata',Georgia,serif;margin:8px 0 18px}
  h2{font:600 1.1rem/1.3 'Literata',Georgia,serif;margin:28px 0 10px}
  p{margin:0 0 12px}
  .hint{color:var(--muted);font-size:.92rem}
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
  .stats div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 10px}
  .stats b{display:block;font:600 1.8rem/1.1 'Literata',Georgia,serif}
  .stats span{color:var(--muted);font-size:.85rem}

  .btn{min-height:44px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
  .btn:hover{border-color:var(--brand)}
  .primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .big{width:100%;font-size:1.05rem;min-height:52px}
  .link{background:none;border:0;padding:6px 4px;color:var(--brand);font:inherit;font-size:.9rem;cursor:pointer;text-decoration:underline}
  .danger{color:var(--bad)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

  .progress{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:4px 0 16px}
  .progress i{display:block;height:100%;background:var(--brand);transition:width .25s}
  .topline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem}

  .card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:22px 20px;min-height:200px}
  .instr{color:var(--muted);font-size:.9rem;margin-bottom:8px}
  .prompt{font:600 1.9rem/1.25 'Literata',Georgia,serif;overflow-wrap:anywhere}
  .ctx{font:400 1.05rem/1.6 'Literata',Georgia,serif;color:var(--muted);margin:14px 0 0}
  .gap{display:inline-block;border-bottom:2px solid var(--brand);height:1em;vertical-align:baseline;margin:0 2px}
  .answer{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .answer .prompt{color:var(--brand)}
  .note{margin-top:10px;font-size:.92rem;color:var(--muted)}
  .speak{margin-left:8px;vertical-align:middle;min-height:36px;padding:4px 10px;font-size:.85rem}
  .verdict{margin-top:14px;font-weight:500}
  .verdict.ok{color:var(--good)} .verdict.near{color:var(--hard)} .verdict.bad{color:var(--bad)}

  input[type=text],input[type=number],textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
  #ans{font:400 1.25rem 'Literata',Georgia,serif;margin-top:16px}
  textarea{resize:vertical}
  label{display:block;font-weight:500;margin:14px 0 6px}
  label.inline{display:flex;gap:10px;align-items:center;font-weight:400}
  label.inline input{width:20px;height:20px}

  .rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
  .rate{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:8px;border:1px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;min-height:64px}
  .rate small{font-weight:400;color:var(--muted);font-size:.78rem}
  .rate.r0{border-bottom-color:var(--bad)} .rate.r1{border-bottom-color:var(--hard)}
  .rate.r2{border-bottom-color:var(--good)} .rate.r3{border-bottom-color:var(--brand)}
  .rate.suggest{background:var(--soft);border-color:var(--brand)}

  ul.items{list-style:none;margin:12px 0 0;padding:0}
  .item{display:flex;gap:12px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
  .item .de{font:600 1.1rem 'Literata',Georgia,serif;overflow-wrap:anywhere}
  .item .fr{color:var(--ink)}
  .item .ctxs{color:var(--muted);font-size:.88rem;margin-top:4px}
  .item .side{text-align:right;flex:none}
  .chip{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
  .chip.due{background:var(--brand);color:var(--brand-ink)} .chip.new{color:var(--hard)}

  nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
  nav button{flex:1;padding:14px 4px 12px;background:none;border:0;border-top:3px solid transparent;color:var(--muted);font:500 .85rem 'Public Sans',system-ui,sans-serif;cursor:pointer}
  nav button[aria-current="page"]{color:var(--brand);border-top-color:var(--brand)}

  #toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;z-index:10}
  #toast.show{opacity:1}
  .warn{background:var(--soft);border:1px solid var(--hard);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:.92rem}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="main"></main>
<nav aria-label="Navigation principale"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const DAY = 86400000;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const dayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const startOfDay = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = n => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n); return d.getTime(); };

/* ---------- Stockage local (propre à ce navigateur) ---------- */
let storageWorks = true;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { storageWorks = false; return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { storageWorks = false; return false; } }
};
let cards = store.get('dd_cards', []);
let settings = Object.assign({ newPerDay: 10, direction: 'fr-de', typing: true, theme: 'auto', lastBackup: null }, store.get('dd_settings', {}));
let log = store.get('dd_log', {});
function save(){
  const ok = store.set('dd_cards', cards) && store.set('dd_settings', settings) && store.set('dd_log', log);
  if (!ok) toast("Enregistrement impossible dans ce navigateur. Pensez à exporter vos données.");
}
function applyTheme(){
  if (settings.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', settings.theme);
}

/* ---------- Répétition espacée (type SM-2) ---------- */
// grade : 0 = À revoir, 1 = Difficile, 2 = Bien, 3 = Facile
function schedule(c, g){
  let ease = c.ease || 2.5, interval = c.interval || 0, reps = c.reps || 0, lapses = c.lapses || 0, due;
  if (g === 0){
    lapses++; reps = 0; interval = 0; ease = Math.max(1.3, ease - 0.2);
    due = Date.now() + 10 * 60000;
  } else {
    if (g === 1){ interval = reps === 0 ? 1 : Math.max(interval + 1, Math.round(interval * 1.2)); ease = Math.max(1.3, ease - 0.15); }
    else if (g === 2){ interval = reps === 0 ? 1 : reps === 1 ? Math.max(3, interval + 1) : Math.max(interval + 1, Math.round(interval * ease)); }
    else { interval = reps === 0 ? 4 : Math.max(interval + 2, Math.round(interval * ease * 1.3)); ease = ease + 0.15; }
    reps++;
    due = addDays(interval);
  }
  return { ease, interval, reps, lapses, due };
}
function rateLabel(c, g){
  if (g === 0) return '10 min';
  const i = schedule(c, g).interval;
  return i >= 30 ? Math.round(i / 30) + ' mois' : i + ' j';
}
const byId = id => cards.find(c => c.id === id);
function newCard(f){
  return { id: uid(), de: f.de, fr: f.fr, ctx: f.ctx || '', note: f.note || '', created: Date.now(),
           due: 0, ease: 2.5, interval: 0, reps: 0, lapses: 0, lastReview: null };
}
function buildQueue(){
  const now = Date.now();
  const l = log[dayKey()] || {};
  const due = cards.filter(c => c.lastReview && c.due <= now).sort((a, b) => a.due - b.due).map(c => c.id);
  const room = Math.max(0, settings.newPerDay + (l.bonus || 0) - (l.newSeen || 0));
  const fresh = cards.filter(c => !c.lastReview).sort((a, b) => a.created - b.created).slice(0, room).map(c => c.id);
  return { due, fresh };
}
function streak(){
  let n = 0, t = Date.now();
  const has = k => log[k] && log[k].reviews > 0;
  if (!has(dayKey(t))) t -= DAY;
  while (has(dayKey(t))) { n++; t -= DAY; }
  return n;
}

/* ---------- Vérification de la réponse tapée ---------- */
const stripP = s => s.replace(/[.,;:!?"“”„()]/g, '').replace(/\s+/g, ' ').trim();
const lower = s => stripP(s).toLowerCase();
const noArt = s => s.replace(/^(der|die|das|ein|eine)\s+/, '');
const fold = s => s.replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u').replace(/ß/g, 'ss');
function verdict(typed, target){
  const a = lower(typed), b = lower(target);
  if (!a) return null;
  if (a === b) return stripP(typed) === stripP(target)
    ? { k: 'ok', t: 'Exact.' }
    : { k: 'near', t: 'Le mot est bon. Attention aux majuscules : les noms en prennent une.' };
  if (noArt(a) === noArt(b)) return { k: 'near', t: "Le mot est bon, vérifiez l'article." };
  if (fold(noArt(a)) === fold(noArt(b))) return { k: 'near', t: 'Presque : attention aux umlauts et au ß.' };
  return { k: 'bad', t: "Ce n'est pas la bonne réponse." };
}

/* ---------- Phrase d'exemple avec le mot masqué ---------- */
function ctxHtml(ctx, de, mask){
  if (!ctx) return '';
  if (!mask) return esc(ctx);
  const toks = de.split(/\s+/).map(t => t.replace(/[^\p{L}]/gu, '')).filter(t => t.length >= 3 && !/^(der|die|das|ein|eine|sich|zum|zur)$/i.test(t));
  if (!toks.length) return esc(ctx);
  const w = toks.sort((a, b) => b.length - a.length)[0];
  const stem = w.length > 5 ? w.slice(0, w.length - 2) : w.length > 3 ? w.slice(0, w.length - 1) : w;
  const re = new RegExp(escRe(stem) + '\\p{L}*', 'giu');
  let out = '', last = 0, m;
  while ((m = re.exec(ctx))){
    out += esc(ctx.slice(last, m.index)) + '<span class="gap" style="width:' + Math.min(9, Math.max(3, m[0].length)) + 'ch"></span>';
    last = m.index + m[0].length;
    if (m[0].length === 0) re.lastIndex++;
  }
  return out + esc(ctx.slice(last));
}

/* ---------- Voix allemande du navigateur ---------- */
function speak(text){
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    const v = (speechSynthesis.getVoices() || []).find(v => v.lang && v.lang.toLowerCase().startsWith('de'));
    if (v) u.voice = v;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) { toast('La lecture vocale n\'est pas disponible sur ce navigateur.'); }
}

/* ---------- Messages ---------- */
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), Math.max(2800, msg.length * 55));
}

/* ---------- État de l'interface ---------- */
let view = 'review', session = null, editingId = null, pendingDelete = null, pendingWipe = false, listQuery = '';

function setView(v){
  view = v;
  if (v !== 'add') editingId = null;
  pendingDelete = null; pendingWipe = false;
  render();
  window.scrollTo(0, 0);
}
function render(){
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'));
  const m = $('#main');
  const banner = storageWorks ? '' : '<div class="warn">Ce navigateur bloque le stockage local : vos mots ne seront pas conservés. Exportez-les régulièrement depuis les réglages.</div>';
  m.innerHTML = banner;
  const box = document.createElement('div');
  m.appendChild(box);
  const builtin = { review: renderReview, add: renderAdd, list: renderList, settings: renderSettings };
  const mod = modules.find(x => x.id === view);
  const fn = builtin[view] || (mod && mod.render);
  if (fn) fn(box); else { view = 'review'; renderReview(box); }
}

/* ---------- Vue : Réviser ---------- */
function renderReview(m){
  if (!session) return renderHome(m);
  if (session.queue.length === 0) return renderDone(m);

  const id = session.queue[0], c = byId(id);
  if (!c){ session.queue.shift(); return renderReview(m); }
  if (!session.dir[id]) session.dir[id] = settings.direction === 'mix' ? (Math.random() < 0.5 ? 'fr-de' : 'de-fr') : settings.direction;
  const dir = session.dir[id], back = session.stage === 'back';
  const pct = Math.round(session.done / session.total * 100);

  let inner = '';
  if (dir === 'fr-de'){
    inner += '<div class="instr">Comment dit-on en allemand ?</div><div class="prompt">' + esc(c.fr) + '</div>';
    if (c.ctx) inner += '<p class="ctx">' + ctxHtml(c.ctx, c.de, !back) + '</p>';
    if (!back && settings.typing) inner += '<input type="text" id="ans" placeholder="Tapez votre réponse" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Votre réponse en allemand">';
    if (back){
      inner += '<div class="answer"><div class="prompt">' + esc(c.de) + '<button class="btn speak" data-act="speak" data-text="' + esc(c.de) + '" aria-label="Écouter">Écouter</button></div>';
      if (session.verdict) inner += '<div class="verdict ' + session.verdict.k + '">' + esc(session.verdict.t) + (session.typed ? ' Vous avez écrit : ' + esc(session.typed) : '') + '</div>';
      if (c.note) inner += '<div class="note">' + esc(c.note) + '</div>';
      inner += '</div>';
    }
  } else {
    inner += '<div class="instr">Que veut dire ce mot ?</div><div class="prompt">' + esc(c.de) + '<button class="btn speak" data-act="speak" data-text="' + esc(c.de) + '" aria-label="Écouter">Écouter</button></div>';
    if (c.ctx) inner += '<p class="ctx">' + esc(c.ctx) + '</p>';
    if (back){
      inner += '<div class="answer"><div class="prompt">' + esc(c.fr) + '</div>';
      if (c.note) inner += '<div class="note">' + esc(c.note) + '</div>';
      inner += '</div>';
    }
  }

  let actions;
  if (!back){
    const label = (dir === 'fr-de' && settings.typing) ? 'Vérifier' : 'Voir la réponse';
    actions = '<div class="row"><button class="btn primary big" data-act="reveal">' + label + '</button></div>';
  } else {
    const sug = session.verdict ? { ok: 2, near: 1, bad: 0 }[session.verdict.k] : -1;
    const names = ['À revoir', 'Difficile', 'Bien', 'Facile'];
    actions = '<div class="rates">' + names.map((n, g) =>
      '<button class="rate r' + g + (g === sug ? ' suggest' : '') + '" data-act="rate" data-g="' + g + '">' + n + '<small>' + rateLabel(c, g) + '</small></button>').join('') + '</div>' +
      '<p class="hint" style="margin-top:10px">Raccourcis clavier : 1, 2, 3, 4.</p>';
  }

  m.innerHTML = '<div class="topline"><span>' + session.done + ' / ' + session.total + ' cartes</span><button class="link" data-act="quit">Arrêter</button></div>' +
    '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
    '<div class="card">' + inner + '</div>' + actions;

  const a = $('#ans'); if (a) a.focus();
}

function renderHome(m){
  const q = buildQueue(), nDue = q.due.length, nNew = q.fresh.length;
  const l = log[dayKey()] || { reviews: 0 };
  let body;
  if (cards.length === 0){
    body = '<p>Votre carnet est vide. Ajoutez un mot avec sa phrase d\'exemple : c\'est ce qui rend la mémorisation solide.</p>' +
      '<div class="row"><button class="btn primary" data-act="goto-add">Ajouter un mot</button><button class="btn" data-act="seed">Charger 5 mots d\'exemple</button></div>';
  } else if (nDue + nNew > 0){
    body = '<button class="btn primary big" data-act="start">Commencer (' + (nDue + nNew) + ' cartes)</button>';
  } else {
    const future = cards.filter(c => c.lastReview && c.due > Date.now()).map(c => c.due);
    let nxt = '';
    if (future.length){
      const d = Math.round((startOfDay(Math.min.apply(null, future)) - startOfDay()) / DAY);
      nxt = d <= 0 ? ' La prochaine carte revient plus tard aujourd\'hui.' : d === 1 ? ' La prochaine carte revient demain.' : ' La prochaine carte revient dans ' + d + ' jours.';
    }
    body = '<p>Tout est à jour pour le moment.' + nxt + '</p>';
    if (cards.some(c => !c.lastReview)) body += '<div class="row"><button class="btn" data-act="more">Apprendre 5 nouveaux mots de plus</button></div>';
  }
  m.innerHTML = '<h1>Wortschatz</h1>' +
    '<div class="stats"><div><b>' + nDue + '</b><span>à réviser</span></div><div><b>' + nNew + '</b><span>nouveaux aujourd\'hui</span></div><div><b>' + streak() + '</b><span>jours d\'affilée</span></div></div>' +
    body + '<p class="hint" style="margin-top:16px">Aujourd\'hui : ' + (l.reviews || 0) + ' révisions.</p>' + backupNag();
}

function renderDone(m){
  m.innerHTML = '<h1>Session terminée</h1><div class="card"><p class="prompt">' + session.total + ' cartes revues.</p>' +
    '<p class="hint">' + (session.again ? session.again + ' carte(s) ont été à revoir avant d\'être retenues.' : 'Aucune carte n\'a été à revoir.') + '</p></div>' +
    '<div class="row"><button class="btn primary" data-act="finish">Retour</button><button class="btn" data-act="goto-add">Ajouter un mot</button></div>';
}

/* ---------- Vue : Ajouter / Modifier ---------- */
function renderAdd(m){
  const c = editingId ? byId(editingId) : null;
  m.innerHTML = '<h1>' + (c ? 'Modifier le mot' : 'Ajouter un mot') + '</h1>' +
    '<label for="f-de">Mot ou expression en allemand (avec l\'article)</label><input type="text" id="f-de" autocomplete="off" value="' + esc(c ? c.de : '') + '">' +
    '<label for="f-fr">Traduction en français</label><input type="text" id="f-fr" autocomplete="off" value="' + esc(c ? c.fr : '') + '">' +
    '<label for="f-ctx">Phrase d\'exemple en allemand</label><textarea id="f-ctx" rows="2">' + esc(c ? c.ctx : '') + '</textarea>' +
    '<label for="f-note">Note (facultatif)</label><input type="text" id="f-note" autocomplete="off" value="' + esc(c ? c.note : '') + '">' +
    '<div class="row"><button class="btn primary" data-act="save-card">Enregistrer</button>' + (c ? '<button class="btn" data-act="cancel-edit">Annuler</button>' : '') + '</div>' +
    '<p class="hint" style="margin-top:14px">Une phrase entière se retient mieux qu\'un mot isolé : pendant la révision, le mot y sera masqué pour vous aider à le retrouver.</p>';
  if (!c) $('#f-de').focus();
}

/* ---------- Vue : Carnet ---------- */
function statusOf(c){
  if (!c.lastReview) return { t: 'Nouveau', k: 'new' };
  if (c.due <= Date.now()) return { t: 'À réviser', k: 'due' };
  return { t: 'Dans ' + Math.max(1, Math.round((c.due - startOfDay()) / DAY)) + ' j', k: 'ok' };
}
function listItems(filter){
  const f = filter.trim().toLowerCase();
  const arr = cards.filter(c => !f || (c.de + ' ' + c.fr + ' ' + (c.ctx || '')).toLowerCase().includes(f)).sort((a, b) => b.created - a.created);
  if (!arr.length) return '<p class="hint">' + (cards.length ? 'Aucun résultat.' : 'Le carnet est vide.') + '</p>';

  }).join('') + '</ul>';
}

/* ---------- Sauvegarde : fusion, fichier, Google Drive ---------- */
function mergeImport(text){
  const d = JSON.parse(text);
  if (!d || !Array.isArray(d.cards)) throw new Error('format');
  let added = 0;
  d.cards.forEach(ic => {
    if (!ic || !ic.de || !ic.fr) return;
    const ex = cards.find(c => c.id === ic.id) || cards.find(c => c.de.toLowerCase() === String(ic.de).toLowerCase());
    if (!ex){ cards.push(Object.assign(newCard(ic), ic)); added++; }
    else if ((ic.lastReview || 0) > (ex.lastReview || 0)) Object.assign(ex, ic, { id: ex.id });
  });
  if (d.log) Object.keys(d.log).forEach(k => { if (!log[k]) log[k] = d.log[k]; });
  save();
  return added;
}
function lastBackupText(){
  return settings.lastBackup ? 'Dernière sauvegarde : ' + new Date(settings.lastBackup).toLocaleDateString('fr-FR') + '.' : 'Aucune sauvegarde pour le moment.';
}
function backupNag(){
  if (cards.length < 10) return '';
  if (settings.lastBackup && Date.now() - settings.lastBackup < 7 * DAY) return '';
  return '<div class="warn" style="margin-top:14px">Pensez à sauvegarder votre carnet (Réglages, Sauvegarde). Le navigateur peut l\'effacer.</div>';
}
async function downloadBackup(){
  const name = 'deutschduo-sauvegarde-' + dayKey() + '.json';
  const file = new File([exportText()], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Sauvegarde DeutschDuo' });
      settings.lastBackup = Date.now(); save(); if (view === 'settings') render();
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  settings.lastBackup = Date.now(); save(); toast('Fichier téléchargé.');
  if (view === 'settings') render();
}

const DRIVE_FILE = 'deutschduo-sauvegarde.json';
function loadGsi(){
  return new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => res(); s.onerror = () => rej(new Error('gsi'));
    document.head.appendChild(s);
  });
}
async function driveToken(){
  const cid = store.get('dd_gclient', '');
  if (!cid) throw new Error('noclient');
  await loadGsi();
  return new Promise((res, rej) => {
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: r => r.error ? rej(new Error(r.error)) : res(r.access_token),
      error_callback: e => rej(new Error((e && e.type) || 'popup'))
    });
    tc.requestAccessToken();
  });
}
async function driveFind(tok){
  const q = encodeURIComponent("name='" + DRIVE_FILE + "' and trashed=false");
  const r = await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,modifiedTime)&orderBy=' + encodeURIComponent('modifiedTime desc'), { headers: { Authorization: 'Bearer ' + tok } });
  if (!r.ok) throw new Error('drive ' + r.status);
  const d = await r.json();
  return (d.files && d.files[0]) || null;
}
function driveError(e){
  const m = String((e && e.message) || e);
  if (m === 'noclient') toast('Collez d\'abord l\'identifiant client Google ci-dessus.');
  else if (m === 'gsi') toast('Impossible de charger Google. Vérifiez votre connexion.');
  else if (/popup|access_denied|closed|blocked/i.test(m)) toast('Connexion à Google annulée ou bloquée.');
  else if (/drive (401|403)/.test(m)) toast('Google a refusé l\'accès : vérifiez que l\'API Drive est activée et que votre adresse est utilisateur de test.');
  else toast('La sauvegarde Drive a échoué (' + m + ').');
}
async function driveSave(){
  try {
    const tok = await driveToken();
    const text = exportText(), f = await driveFind(tok);
    let r;
    if (f){
      r = await fetch('https://www.googleapis.com/upload/drive/v3/files/' + f.id + '?uploadType=media', {
        method: 'PATCH', headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' }, body: text });
    } else {
      const b = 'ddb' + uid();
      const body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify({ name: DRIVE_FILE }) +
        '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + text + '\r\n--' + b + '--';
      r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST', headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'multipart/related; boundary=' + b }, body });
    }
    if (!r.ok) throw new Error('drive ' + r.status);
    settings.lastBackup = Date.now(); save();
    toast('Sauvegarde enregistrée sur Google Drive.');
    if (view === 'settings') render();
  } catch (e) { driveError(e); }
}
async function driveLoad(){
  try {
    const tok = await driveToken();
    const f = await driveFind(tok);
    if (!f){ toast('Aucune sauvegarde trouvée sur votre Drive.'); return; }
    const r = await fetch('https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media', { headers: { Authorization: 'Bearer ' + tok } });
    if (!r.ok) throw new Error('drive ' + r.status);
    const n = mergeImport(await r.text());
    toast(n + ' mots restaurés depuis Drive.'); render();
  } catch (e) { driveError(e); }
}

/* ---------- Modules et IA (Gemini) ---------- */
const modules = [];
function buildNav(){
  const tabs = [['review', 'Réviser'], ['add', 'Ajouter'], ['list', 'Carnet']].concat(modules.map(m => [m.id, m.label])).concat([['settings', 'Réglages']]);
  $('nav').innerHTML = tabs.map(t => '<button data-view="' + esc(t[0]) + '">' + esc(t[1]) + '</button>').join('');
}
function register(mod){
  const i = modules.findIndex(x => x.id === mod.id);
  if (i >= 0) modules[i] = mod; else modules.push(mod);
  buildNav();
  if (view === mod.id) render(); else document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'));
}
async function gemini(o){
  const key = store.get('dd_gkey', '');
  if (!key) throw new Error('nokey');
  const model = store.get('dd_gmodel', '') || 'gemini-flash-latest';
  const body = { contents: [{ role: 'user', parts: o.parts }], generationConfig: { temperature: o.temperature == null ? 0.2 : o.temperature } };
  if (o.system) body.systemInstruction = { parts: [{ text: o.system }] };
  if (o.json) body.generationConfig.responseMimeType = 'application/json';
  let r;
  for (let attempt = 0; attempt < 3; attempt++){
    r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(body) });
    if (r.ok || ![500, 502, 503, 504].includes(r.status) || attempt === 2) break;
    await new Promise(res => setTimeout(res, 1500 * (attempt + 1)));
  }
  if (!r.ok){
    let detail = '';
    try { const j = await r.json(); detail = (j.error && j.error.message) || ''; } catch (e) {}
    const err = new Error('gemini ' + r.status); err.status = r.status; err.detail = detail; throw err;
  }
  const d = await r.json();
  const parts = d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts;
  if (!parts) throw new Error('empty');
  return parts.map(p => p.text || '').join('');
}
function geminiError(e){
  const m = String((e && e.message) || e), st = e && e.status, det = (e && e.detail) || '';
  if (m === 'nokey') toast('Ajoutez d\'abord votre clé Gemini dans les Réglages.');
  else if (st === 400 && /API key/i.test(det)) toast('Clé Gemini refusée : vérifiez-la dans les Réglages.');
  else if (st === 400) toast('Requête refusée par Gemini' + (det ? ' : ' + det.slice(0, 120) : '') + '.');
  else if (st === 401 || st === 403) toast('Clé Gemini refusée ou non autorisée. Vérifiez-la dans les Réglages.');
  else if (st === 404) toast('Modèle introuvable : changez le nom du modèle dans les Réglages.');
  else if (st === 429) toast('Quota gratuit atteint. Réessayez dans quelques minutes, ou demain.');
  else if (st >= 500) toast('Gemini a renvoyé l\'erreur ' + st + (det ? ' : ' + det.slice(0, 140) : '') + '. Essayez un autre modèle : Réglages, « Lister les modèles disponibles ».');
  else if (m === 'empty') toast('Gemini n\'a rien renvoyé (texte bloqué ?). Réessayez.');
  else toast('Connexion à Gemini impossible. Vérifiez votre réseau.');
}

/* ---------- Actions ---------- */
const acts = {
  'goto-add'(){ setView('add'); },
  start(){
    const q = buildQueue(), ids = q.due.concat(q.fresh);
    if (!ids.length) return;
    session = { queue: ids, total: ids.length, done: 0, stage: 'front', dir: {}, typed: '', verdict: null, again: 0 };
    render();
  },
  reveal(){
    if (!session || session.stage !== 'front') return;
    const c = byId(session.queue[0]);
    const inp = $('#ans');
    session.typed = inp ? inp.value.trim() : '';
    session.verdict = (inp && c) ? verdict(session.typed, c.de) : null;
    session.stage = 'back';
    render();
  },
  rate(id, el){
    if (!session || session.stage !== 'back') return;
    const g = typeof id === 'number' ? id : Number(el.dataset.g);
    const cid = session.queue.shift(), c = byId(cid);
    if (c){
      const wasNew = !c.lastReview;
      Object.assign(c, schedule(c, g));
      c.lastReview = Date.now();
      const k = dayKey(), l = log[k] = log[k] || { reviews: 0, newSeen: 0, correct: 0, bonus: 0 };
      l.reviews++; if (wasNew) l.newSeen++; if (g >= 2) l.correct++;
      if (g === 0){ session.queue.push(cid); session.again++; } else session.done++;
      save();
    }
    session.stage = 'front'; session.typed = ''; session.verdict = null;
    render();
  },
  quit(){ session = null; render(); },
  finish(){ session = null; render(); },
  more(){
    const k = dayKey(), l = log[k] = log[k] || { reviews: 0, newSeen: 0, correct: 0, bonus: 0 };
    l.bonus = (l.bonus || 0) + 5; save(); render();
  },
  speak(_, el){ speak(el.dataset.text); },
  seed(){
    const ex = [
      { de: 'die Entscheidung', fr: 'la décision', ctx: 'Diese Entscheidung ist mir nicht leicht gefallen.' },
      { de: 'sich beschweren über', fr: 'se plaindre de', ctx: 'Die Kunden beschweren sich über die lange Wartezeit.', note: '+ Akkusativ' },
      { de: 'die Herausforderung', fr: 'le défi', ctx: 'Der Umzug war eine große Herausforderung.' },
      { de: 'verzichten auf', fr: 'renoncer à', ctx: 'Ich möchte nicht auf meinen Urlaub verzichten.', note: '+ Akkusativ' },
      { de: 'zuverlässig', fr: 'fiable', ctx: 'Er ist ein sehr zuverlässiger Mitarbeiter.' }
    ];
    let n = 0;
    ex.forEach(e => { if (!cards.some(c => c.de.toLowerCase() === e.de.toLowerCase())){ cards.push(newCard(e)); n++; } });
    save(); toast(n + ' mots ajoutés.'); render();
  },
  'save-card'(){
    const de = $('#f-de').value.trim(), fr = $('#f-fr').value.trim(), ctx = $('#f-ctx').value.trim(), note = $('#f-note').value.trim();
    if (!de || !fr){ toast('Le mot allemand et sa traduction sont obligatoires.'); return; }
    if (editingId){
      const c = byId(editingId);
      if (c) Object.assign(c, { de, fr, ctx, note });
      editingId = null; save(); toast('Mot modifié.'); setView('list'); return;
    }
    if (cards.some(c => c.de.toLowerCase() === de.toLowerCase())){ toast('Ce mot est déjà dans votre carnet.'); return; }
    cards.push(newCard({ de, fr, ctx, note }));
    save(); toast('Mot ajouté.'); render();
  },
  'cancel-edit'(){ setView('list'); },
  edit(id){ editingId = id; view = 'add'; render(); window.scrollTo(0, 0); },
  del(id){
    if (pendingDelete !== id){ pendingDelete = id; $('#items').innerHTML = listItems(listQuery); return; }
    cards = cards.filter(c => c.id !== id); pendingDelete = null; save(); render();
  },
  copy(){
    const t = $('#exp'); t.focus(); t.select();
    try {
      navigator.clipboard.writeText(t.value).then(() => toast('Sauvegarde copiée.'), () => { try { document.execCommand('copy'); toast('Sauvegarde copiée.'); } catch (e) { toast('Sélectionnez le texte et copiez-le à la main.'); } });
    } catch (e) {
      try { document.execCommand('copy'); toast('Sauvegarde copiée.'); } catch (e2) { toast('Sélectionnez le texte et copiez-le à la main.'); }
    }
  },
  import(){
    try { const n = mergeImport($('#imp').value); toast(n + ' mots importés.'); render(); }
    catch (e) { toast('Sauvegarde illisible : collez le texte complet.'); }
  },
  download(){ downloadBackup(); },
  'drive-save'(){ driveSave(); },
  'drive-load'(){ driveLoad(); },
  'ai-models'(){
    const key = store.get('dd_gkey', '');
    if (!key){ toast('Ajoutez d\'abord votre clé Gemini ci-dessus.'); return; }
    toast('Recherche des modèles…');
    fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers: { 'x-goog-api-key': key } })
      .then(r => r.ok ? r.json() : r.json().catch(() => ({})).then(j => { const e = new Error('gemini ' + r.status); e.status = r.status; e.detail = (j.error && j.error.message) || ''; throw e; }))
      .then(d => {
        const skip = /tts|image|embed|live|audio|aqa|imagen|veo|robotics|computer-use/i;
        const names = (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
          .map(m => String(m.name).replace(/^models\//, '')).filter(n => !skip.test(n)).sort();
        if (!names.length){ toast('Aucun modèle trouvé pour cette clé.'); return; }
        const cur = store.get('dd_gmodel', '');
        $('#ai-models').innerHTML = '<label for="s-gpick">Modèles disponibles pour votre clé (' + names.length + ')</label><select id="s-gpick"><option value="">Choisir un modèle…</option>' +
          names.map(n => '<option value="' + esc(n) + '"' + (n === cur ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select>' +
          '<p class="hint" style="margin-top:6px">Les modèles « flash » sont rapides et adaptés ; « lite » est le plus léger. Après le choix, cliquez sur « Tester la connexion ».</p>';
        toast(names.length + ' modèles trouvés.');
      })
      .catch(geminiError);
  },
  'ai-test'(){
    toast('Test en cours…');
    gemini({ parts: [{ text: 'Réponds uniquement par le mot OK.' }], temperature: 0 })
      .then(() => toast('Connexion réussie (' + (store.get('dd_gmodel', '') || 'gemini-flash-latest') + ').'))
      .catch(geminiError);
  },
  wipe(){
    if (!pendingWipe){ pendingWipe = true; render(); return; }
    cards = []; log = {}; pendingWipe = false; session = null; save(); toast('Données effacées.'); render();
  }
};

  else if (id === 's-gclient'){ store.set('dd_gclient', e.target.value.trim()); toast('Identifiant enregistré.'); return; }
  else if (id === 'imp-file'){
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const r = new FileReader(); r.onload = () => { $('#imp').value = String(r.result || ''); toast('Fichier chargé. Cliquez sur Fusionner.'); }; r.readAsText(file);
    return;
  } else return;
  save();
});
document.addEventListener('keydown', e => {
  if (view !== 'review' || !session || !session.queue.length) return;
  const inField = e.target.matches && e.target.matches('input,textarea,select');
  if (session.stage === 'front'){
    if (e.key === 'Enter' && (e.target.id === 'ans' || !inField)){ e.preventDefault(); acts.reveal(); }
    else if (e.key === ' ' && !inField){ e.preventDefault(); acts.reveal(); }
  } else if (!inField && /^[1-4]$/.test(e.key)){
    acts.rate(Number(e.key) - 1);
  }
});

window.DD = {
  $, esc, uid, dayKey, store, toast, register, gemini, geminiError, render, setView,
  pending: null,
  get view(){ return view; },
  get knownDe(){ return cards.map(c => c.de.toLowerCase()); },
  addWord(w){
    if (!w || !w.de || !w.fr) return 'invalid';
    if (cards.some(c => c.de.toLowerCase() === String(w.de).toLowerCase())) return 'dup';
    cards.push(newCard({ de: String(w.de), fr: String(w.fr), ctx: String(w.ctx || ''), note: '' }));
    save(); return 'added';
  }
};

applyTheme();
buildNav();
render();
})();
</script>
